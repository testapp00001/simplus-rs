# Simplus sync server behind Caddy (automatic HTTPS).
#
# 1. Point a DNS name (e.g. sync.example.com) at this machine.
# 2. Put that name in deploy/Caddyfile.
# 3. From the repository root: docker compose -f deploy/docker-compose.yml up -d --build
services:
  simplus-sync:
    build:
      context: ..
      dockerfile: server/simplus-sync-server/Dockerfile
    image: simplus-sync-server
    restart: unless-stopped
    environment:
      # open | invite | closed
      SIMPLUS_REGISTRATION: open
      # Caddy sets X-Forwarded-For; trust it so rate limits see real client IPs.
      SIMPLUS_TRUST_PROXY: "true"
    volumes:
      - simplus-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - simplus-sync

volumes:
  simplus-data:
  caddy-data:
  caddy-config:
