[package]
name = "simplus-sync-server"
description = "Self-hostable, zero-knowledge sync server for the Simplus password vault."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "simplus-sync-server"
path = "src/main.rs"

[dependencies]
simplus-core.workspace = true
simplus-crypto.workspace = true
simplus-vault-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
sha2.workspace = true
getrandom.workspace = true
uuid.workspace = true
data-encoding = "2"

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[lints]
workspace = true
